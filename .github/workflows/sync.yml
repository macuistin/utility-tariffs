name: Sync tariffs

# Reads every source, and opens a pull request when a price changed. No AI and no private
# machine: plain Python on a GitHub runner. A person reviews and merges the pull request.
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      sources:
        description: "Sources to run, space separated, or all"
        default: all

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A fine-grained token in the SYNC_TOKEN secret makes the pull request start CI on its
      # own. Without it the built-in token is used and CI is started by hand below.
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Run the sources
        id: run
        env:
          SOURCES: ${{ github.event.inputs.sources || 'all' }}
        run: |
          set +e
          python -m scripts.sync $SOURCES --report "$RUNNER_TEMP/report.md"
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain tariffs)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check and test what will be proposed
        if: steps.run.outputs.changed == 'true'
        run: |
          python -m scripts.build --check --base origin/main
          python -m unittest discover tests

      - name: Open the pull request
        if: steps.run.outputs.changed == 'true'
        env:
          OWN_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          branch="sync/$(date -u +%Y-%m-%d)-${{ github.run_number }}"
          git config user.name "tariff-sync"
          git config user.email "tariff-sync@users.noreply.github.com"
          git checkout -b "$branch"
          git add tariffs
          git commit -m "chore(tariffs): sync $(date -u +%Y-%m-%d)"
          git push origin "$branch"
          gh label create tariff-sync --color 0E8A16 --description "Opened by the scheduled sync" 2>/dev/null || true
          older=$(gh pr list --label tariff-sync --state open --json number --jq '.[].number')
          url=$(gh pr create --base main --head "$branch" --label tariff-sync \
                  --title "chore(tariffs): sync $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/report.md")
          # Each run starts from main and reads every source again, so it replaces an older one.
          for number in $older; do
            gh pr close "$number" --delete-branch --comment "Replaced by $url, which holds the same changes and any newer ones."
          done
          if [ "$OWN_TOKEN" != "true" ]; then gh workflow run ci.yml --ref "$branch"; fi

      - name: Report a source that failed
        if: steps.run.outputs.exit != '0'
        run: |
          gh label create sync-failed --color B60205 --description "A scheduled sync could not read a source" 2>/dev/null || true
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          { echo "Run: $run_url"; echo; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/issue.md"
          open=$(gh issue list --label sync-failed --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --label sync-failed --title "Tariff sync: a source failed" --body-file "$RUNNER_TEMP/issue.md"
          fi
          exit 1
