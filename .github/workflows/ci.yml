name: CI

# Runs on every pull request and on main. The sync workflow also starts it by hand
# (workflow_dispatch) on the branch it pushes, because a pull request opened with the
# built-in token does not start workflows on its own.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tariffs are valid, indexed as built, and no published revision changed
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python -m scripts.build --check --base "$BASE"
          else
            python -m scripts.build --check
          fi
      - name: Lint and types for the library that other projects copy
        run: |
          python -m pip install --quiet "ruff==0.*" "mypy==2.*"
          ruff check lib/tariffstore
          mypy
      - name: Tests with coverage
        run: |
          python -m pip install --quiet "coverage==7.*"
          python -m coverage run -m unittest discover tests
          python -m coverage report
